name: Daily MVRV Update

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        run: python mvrv_autoupdate.py

      - name: Commit and push updated chart
        run: |
          git config --global user.name "Github Actions Bot"
          git config --global user.email "bot@github.com"
          git add index.html
          git commit -m "Auto-update MVRV Z-Score chart" || exit 0
          git push
